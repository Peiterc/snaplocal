<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SnapLocal harness</title>
  <!-- Everything below resolves against the real editor folder, so the harness
       loads the shipping HTML, CSS and JS instead of a copy that could drift. -->
  <base href="../src/editor/">
</head>
<body>
<script type="module">
/**
 * Development harness: runs the real editor outside the extension.
 *
 * It stubs only the chrome.* surface the editor touches and feeds it a
 * synthetic screenshot, so the drawing tools, undo/redo, text editing and
 * export can be exercised in a plain browser. It is not part of the build.
 */

const store = { local: {}, session: {} };

function area(bag) {
  return {
    async get(query) {
      if (typeof query === 'string') return { [query]: bag[query] };
      if (Array.isArray(query)) return Object.fromEntries(query.map((k) => [k, bag[k]]));
      return { ...query, ...Object.fromEntries(Object.entries(bag).filter(([k]) => k in (query ?? {}))) };
    },
    async set(values) { Object.assign(bag, values); }
  };
}

/**
 * A stand-in screenshot, sized like a real one.
 *
 * The dimensions matter beyond looks: a small sample would sit in a sea of
 * empty stage inside a maximised editor, and the store screenshots taken from
 * it would be mostly blank. It also keeps small text in the frame, so blur
 * strength can still be judged by eye.
 */
function fakeCapture() {
  const c = document.createElement('canvas');
  c.width = 1440; c.height = 900;
  const x = c.getContext('2d');

  x.fillStyle = '#f2f4f8'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#ffffff'; x.fillRect(60, 60, 1320, 780);
  x.strokeStyle = '#dfe3ea'; x.strokeRect(60.5, 60.5, 1319, 779);

  x.fillStyle = '#1b1f24';
  x.font = '600 40px "Segoe UI", sans-serif';
  x.fillText('Painel da conta', 110, 145);

  x.font = '22px "Segoe UI", sans-serif';
  x.fillStyle = '#454b54';
  const lines = [
    'Titular: Maria Aparecida de Souza Lima',
    'CPF: 123.456.789-09      Nascimento: 14/03/1987',
    'E-mail: maria.souza@exemplo.com.br',
    'Token de acesso: sk-9f4c2ae17b0d8e635a91cc47',
    'Endereco: Rua das Acacias, 412 - apto 73 - Sao Paulo/SP',
    'Telefone: (11) 98765-4321      Agencia: 0341   Conta: 88192-6'
  ];
  lines.forEach((line, i) => x.fillText(line, 110, 215 + i * 44));

  x.fillStyle = '#2563eb'; x.fillRect(110, 490, 240, 56);
  x.fillStyle = '#fff'; x.font = '600 20px "Segoe UI", sans-serif';
  x.fillText('Salvar alteracoes', 138, 526);

  x.fillStyle = '#0f172a'; x.fillRect(110, 600, 1220, 150);
  x.fillStyle = '#93c5fd'; x.font = '19px ui-monospace, Consolas, monospace';
  x.fillText('$ curl -H "Authorization: Bearer sk-9f4c2ae17b0d8e6" https://api.exemplo.com', 136, 645);
  x.fillStyle = '#e2e8f0';
  x.fillText('{ "status": "ok", "saldo": 12480.55, "id": 90128371 }', 136, 685);
  x.fillStyle = '#64748b'; x.font = '13px ui-monospace, Consolas, monospace';
  x.fillText('Texto pequeno de 13px para testar o piso do desfoque.', 136, 722);
  return c.toDataURL('image/png');
}

window.chrome = {
  storage: { local: area(store.local), session: area(store.session), onChanged: { addListener() {} } },
  runtime: {
    // The <base> above points at src/editor/, so one level up is src/.
    getURL: (path) => `../${path}`,
    getManifest: () => ({ version: '0.0.0-harness' })
  },
  i18n: { getUILanguage: () => new URLSearchParams(location.search).get('lang') || 'en' },
  downloads: {
    async download({ filename }) {
      document.getElementById('harnessNote').textContent = `download(): ${filename}`;
    }
  }
};

store.session.lastCapture = { dataUrl: fakeCapture(), title: 'Painel da conta', url: 'https://exemplo.com', at: Date.now() };

// ?shot=<nome> pre-monta um quadro para os screenshots da loja. O aviso de blur
// precisa estar decidido antes do editor iniciar.
const shot = new URLSearchParams(location.search).get('shot');
if (shot && shot !== 'warn') store.local.blurWarningDismissed = true;

// Eventos de ponteiro sinteticos nao tem pointerId ativo, e setPointerCapture
// lanca NotFoundError nesse caso. So o harness precisa disto.
HTMLElement.prototype.setPointerCapture = function () {};

// Pull in the shipping markup, then hand control to the real editor script.
const page = await (await fetch('editor.html')).text();
const parsed = new DOMParser().parseFromString(page, 'text/html');
for (const link of parsed.head.querySelectorAll('link[rel="stylesheet"]')) {
  document.head.append(link.cloneNode(true));
}
document.body.className = parsed.body.className;
document.body.innerHTML = parsed.body.innerHTML
  + '<div id="harnessNote" style="position:fixed;left:8px;bottom:8px;font:11px monospace;opacity:.6"></div>';

await import('./editor.js');

/* ---------------- quadros pre-montados para a loja ---------------- */

const board = document.getElementById('board');
/** Espera dois quadros, mas com prazo: requestAnimationFrame não dispara em aba
 *  oculta, e sem o timeout a montagem do quadro trava para sempre no meio. */
const raf = () => new Promise((resolve) => {
  let done = false;
  const finish = () => { if (!done) { done = true; resolve(); } };
  requestAnimationFrame(() => requestAnimationFrame(finish));
  setTimeout(finish, 250);
});

/** Dispara um evento de ponteiro em coordenadas da imagem, nao da tela. */
function at(type, x, y) {
  const r = board.getBoundingClientRect();
  board.dispatchEvent(new PointerEvent(type, {
    clientX: r.left + x * (r.width / board.width),
    clientY: r.top + y * (r.height / board.height),
    button: 0, buttons: type === 'pointerup' ? 0 : 1,
    bubbles: true, pointerId: 1, isPrimary: true
  }));
}

const drag = (x0, y0, x1, y1) => {
  at('pointerdown', x0, y0);
  at('pointermove', (x0 + x1) / 2, (y0 + y1) / 2);
  at('pointermove', x1, y1);
  at('pointerup', x1, y1);
};

const tool = (name) => document.querySelector(`.tool[data-tool="${name}"]`).click();
const swatch = (hex) => document.querySelector(`#swatches button[data-color="${hex}"]`).click();
const deselect = () => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));

async function label(x, y, text) {
  tool('text');
  at('pointerdown', x, y);
  await raf();
  const input = document.getElementById('textInput');
  input.value = text;
  input.dispatchEvent(new Event('input'));
  // Escape em vez de blur(): o campo pode nunca ter recebido foco numa aba de
  // fundo, e aí blur() não dispara nada e o rótulo fica vazio e pendurado.
  input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await raf();
}

const SHOTS = {
  // Borrão e tarja lado a lado, para a diferença entre os dois ficar óbvia.
  async blur() {
    tool('blur');
    drag(104, 318, 902, 358);
    await raf();
    tool('redact');
    drag(104, 230, 660, 270);
    await raf();
    tool('move');
    deselect();
  },

  // O aviso de que borrão é reversível, que nenhum concorrente mostra.
  async warn() {
    tool('blur');
    drag(104, 318, 902, 358);
    await raf();
  },

  // O editor anotando de verdade: marca-texto, retângulo, seta e texto.
  async annotate() {
    tool('highlight');
    drag(102, 230, 700, 272);
    await raf();
    // Desenhar deixa a forma selecionada, então trocar a cor agora repintaria
    // o marca-texto em vez de definir o padrão das próximas formas.
    deselect();

    swatch('#e11d48');
    const stroke = document.getElementById('stroke');
    stroke.value = '7';
    stroke.dispatchEvent(new Event('input'));
    const size = document.getElementById('fontSize');
    size.value = '34';
    size.dispatchEvent(new Event('input'));

    tool('rect');
    drag(96, 474, 366, 562);
    await raf();
    deselect();

    tool('arrow');
    drag(760, 404, 420, 512);
    await raf();
    deselect();

    await label(778, 372, 'Confirme aqui');
    tool('move');
    deselect();
  }
};

if (shot && SHOTS[shot]) {
  const note = document.getElementById('harnessNote');
  try {
    await SHOTS[shot]();
    note.textContent = `quadro: ${shot}`;
  } catch (error) {
    // Sem isto uma falha na montagem some em silêncio e o quadro sai pela
    // metade, parecendo um bug do editor em vez de um bug do harness.
    note.textContent = `ERRO no quadro ${shot}: ${error.message}`;
    note.style.color = '#ff7b72';
  }
}
</script>
</body>
</html>
