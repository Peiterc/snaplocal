<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SnapLocal</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body class="editor">
  <header class="etoolbar">
    <div class="group">
      <button class="tool" data-tool="move" data-i18n-title="tool_move" data-i18n-aria="tool_move">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M5 2.5l10.5 6.2-4.6 1.3-1.9 4.4z"/>
        </svg>
      </button>
    </div>

    <div class="group">
      <button class="tool" data-tool="blur" data-i18n-title="tool_blur" data-i18n-aria="tool_blur">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2.5" y="2.5" width="15" height="15" rx="2.5"/>
          <circle cx="7" cy="7" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="13" cy="7" r="1.6" fill="currentColor" stroke="none" opacity=".55"/>
          <circle cx="7" cy="13" r="1.6" fill="currentColor" stroke="none" opacity=".55"/>
          <circle cx="13" cy="13" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="tool" data-tool="redact" data-i18n-title="tool_redact" data-i18n-aria="tool_redact">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2.5" y="2.5" width="15" height="15" rx="2.5"/>
          <rect x="5" y="7.5" width="10" height="5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>

    <div class="group">
      <button class="tool" data-tool="rect" data-i18n-title="tool_rectangle" data-i18n-aria="tool_rectangle">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="5" width="14" height="10" rx="1"/>
        </svg>
      </button>
      <button class="tool" data-tool="ellipse" data-i18n-title="tool_ellipse" data-i18n-aria="tool_ellipse">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7">
          <ellipse cx="10" cy="10" rx="7" ry="5.5"/>
        </svg>
      </button>
      <button class="tool" data-tool="arrow" data-i18n-title="tool_arrow" data-i18n-aria="tool_arrow">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 16L16 4M16 4h-6M16 4v6"/>
        </svg>
      </button>
      <button class="tool" data-tool="line" data-i18n-title="tool_line" data-i18n-aria="tool_line">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 16L16 4"/>
        </svg>
      </button>
      <button class="tool" data-tool="pen" data-i18n-title="tool_pencil" data-i18n-aria="tool_pencil">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l1-3.5L13.2 4.3a1.8 1.8 0 012.5 2.5L6.5 16z"/>
        </svg>
      </button>
      <button class="tool" data-tool="highlight" data-i18n-title="tool_highlighter" data-i18n-aria="tool_highlighter">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 13.5l6.5-6.5 2.5 2.5L8.5 16H6z"/><path d="M4 17.5h12"/>
        </svg>
      </button>
      <button class="tool" data-tool="text" data-i18n-title="tool_text" data-i18n-aria="tool_text">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M4 5h12M10 5v11M7.5 16h5"/>
        </svg>
      </button>
      <button class="tool" data-tool="crop" data-i18n-title="tool_crop" data-i18n-aria="tool_crop">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M5.5 1.5v13h13M1.5 5.5h13v13"/>
        </svg>
      </button>
    </div>

    <!-- One fixed-size slot holds all three property panels, stacked. Only one
         is visible at a time, but the slot never changes size, so switching
         tools cannot reflow the toolbar and shift the image under the cursor. -->
    <div class="propsdock">
    <div class="group props" id="propsObscure">
      <label for="blurMode" data-i18n="prop_blur_mode"></label>
      <select id="blurMode">
        <option value="blur" data-i18n="prop_blur_mode_blur"></option>
        <option value="pixelate" data-i18n="prop_blur_mode_pixelate"></option>
      </select>
      <label for="blurStrength" data-i18n="prop_blur_strength"></label>
      <input type="range" id="blurStrength" min="12" max="60" step="2" value="24">
    </div>

    <div class="group props" id="propsDraw">
      <div class="swatches" id="swatches" data-i18n-aria="prop_color"></div>
      <input type="color" id="color" value="#e11d48" data-i18n-title="prop_color">
      <label for="stroke" data-i18n="prop_stroke_width"></label>
      <input type="range" id="stroke" min="1" max="20" value="4">
      <label class="check inline" id="fillWrap">
        <input type="checkbox" id="fill"><span data-i18n="prop_fill"></span>
      </label>
    </div>

    <div class="group props" id="propsText">
      <label for="fontSize" data-i18n="prop_font_size"></label>
      <input type="range" id="fontSize" min="12" max="80" step="2" value="26">
      <button class="tool mini" id="bold" data-i18n-title="prop_font_bold"><b>B</b></button>
      <button class="tool mini" id="italic" data-i18n-title="prop_font_italic"><i>I</i></button>
      <button class="tool mini" id="outline" data-i18n-title="prop_text_outline"><span class="oline">A</span></button>
    </div>

    <div class="group props" id="propsCrop">
      <span class="readout" id="cropSize"></span>
      <button class="btn" id="cropCancel" data-i18n="action_crop_cancel"></button>
      <button class="btn primary" id="cropApply" data-i18n="action_crop_apply"></button>
    </div>
    </div>

    <div class="group">
      <button class="tool" id="undo" data-i18n-title="action_undo" data-i18n-aria="action_undo">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.5 8.5h9a4 4 0 010 8H8M3.5 8.5l3.5-3.5M3.5 8.5L7 12"/>
        </svg>
      </button>
      <button class="tool" id="redo" data-i18n-title="action_redo" data-i18n-aria="action_redo">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16.5 8.5h-9a4 4 0 000 8H12M16.5 8.5L13 5M16.5 8.5L13 12"/>
        </svg>
      </button>
      <button class="tool" id="remove" data-i18n-title="action_delete" data-i18n-aria="action_delete">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M4 5.5h12M8 5.5V4h4v1.5M6 5.5l.8 10h6.4l.8-10M8.5 8.5v4M11.5 8.5v4"/>
        </svg>
      </button>
    </div>

    <div class="group push">
      <button class="tool" id="zoomOut" data-i18n-title="action_zoom_out" data-i18n-aria="action_zoom_out">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.5"/><path d="M13 13l3.5 3.5M6.5 9h5"/>
        </svg>
      </button>
      <button class="zoomlabel" id="zoomFit" data-i18n-title="action_zoom_fit">100%</button>
      <button class="tool" id="zoomIn" data-i18n-title="action_zoom_in" data-i18n-aria="action_zoom_in">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="9" cy="9" r="5.5"/><path d="M13 13l3.5 3.5M6.5 9h5M9 6.5v5"/>
        </svg>
      </button>
    </div>

    <div class="group actions">
      <button class="btn" id="copy" data-i18n="action_copy"></button>
      <button class="btn primary" id="save" data-i18n="action_save"></button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="canvas-wrap" id="wrap">
      <canvas id="board"></canvas>
      <textarea id="textInput" spellcheck="false" hidden></textarea>
    </div>
  </div>

  <dialog id="blurWarning" class="warn-dialog">
    <h2 data-i18n="blur_warning_title"></h2>
    <p data-i18n="blur_warning_body"></p>
    <label class="check">
      <input type="checkbox" id="blurWarningDismiss">
      <span data-i18n="blur_warning_dont_show"></span>
    </label>
    <div class="warn-actions">
      <button class="btn" id="keepBlur" data-i18n="blur_warning_keep"></button>
      <button class="btn primary" id="switchRedact" data-i18n="blur_warning_switch"></button>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script type="module" src="editor.js"></script>
</body>
</html>
